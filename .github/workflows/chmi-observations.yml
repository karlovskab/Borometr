name: Naměřené počasí ČHMÚ
on:
  workflow_dispatch:
  schedule:
    - cron: '12 * * * *'
  push:
    paths:
      - scripts/fetch_chmi_now.py
      - .github/workflows/chmi-observations.yml
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  measurements:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Stáhnout původní měření ČHMÚ
        run: python scripts/fetch_chmi_now.py
      - name: Uložit naměřené hodnoty
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/chmi-observations.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aktualizovat naměřené počasí ČHMÚ'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
        id: deployment
